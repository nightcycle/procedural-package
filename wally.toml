[package]
name = "nightcycle/procedural-package"
description = "using procedural models to create local packages"
version = "0.3.0"
license = "Apache"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
include = ["src", "default.project.json", "LICENSE"]
exclude = ["Packages", "DevPackages", "demo", "stories", "src/**/*.story.luau"]

[dependencies]
IndexUtil = "nightcycle/index-util@^3.1.0"
Type = "osyrisrblx/t@3.1.1"

[dev-dependencies]
UILabs = "pepeeltoro41/ui-labs@2.4.2"
